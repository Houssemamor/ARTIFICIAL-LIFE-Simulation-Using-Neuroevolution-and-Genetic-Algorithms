[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-life-neuroevolution-simulation"
description = "An immersive artificial life simulation with neuroevolution agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["artificial life", "neuroevolution", "simulation", "AI", "evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/example/artificial-life-neuroevolution"
Documentation = "https://github.com/example/artificial-life-neuroevolution/wiki"
Repository = "https://github.com/example/artificial-life-neuroevolution"

[project.dependencies]
torch = ">=2.0.0"
pygame = ">=2.5.0"
numpy = ">=1.24.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.9",
]
debug = [
    "imgui[pygame]>=2.5.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = false