[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-life-neuroevolution-simulation"
version = "0.1.0"
description = "An immersive artificial life simulation with neuroevolution agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["artificial life", "neuroevolution", "simulation", "AI", "evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "torch==2.14.0",
    "pygame-ce==2.5.8",
    "numpy==2.5.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "pydantic-core==2.41.5",
]

[project.urls]
Homepage = "https://github.com/example/artificial-life-neuroevolution"
Documentation = "https://github.com/example/artificial-life-neuroevolution/wiki"
Repository = "https://github.com/example/artificial-life-neuroevolution"

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "flake8==7.3.0",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "mypy-extensions==1.0.0",
    "types-setuptools==69.5.1",
]
debug = [
    "imgui[pygame]>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "agents*", "neural*", "simulation*", "visualization*", "mutation*", "crossover*", "selection*", "evolution*", "analytics*", "metrics*", "config_driven*", "statistical_comparison*", "experiments*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = false