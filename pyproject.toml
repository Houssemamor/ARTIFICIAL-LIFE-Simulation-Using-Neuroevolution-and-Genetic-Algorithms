[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-life-neuroevolution-simulation"
version = "0.1.0"
description = "An immersive artificial life simulation with neuroevolution agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["artificial life", "neuroevolution", "simulation", "AI", "evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "torch==2.14.0",
    "pygame-ce==2.5.8",
    "numpy==2.5.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "pydantic-core==2.41.5",
    "scipy==1.18.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
]

[project.urls]
# Homepage targets GitHub Pages; it goes live once a gh-pages branch is
# published (planned with the Phase 8 packaging/report work).
Homepage = "https://houssemamor.github.io/ARTIFICIAL-LIFE-Simulation-Using-Neuroevolution-and-Genetic-Algorithms/"
Documentation = "https://github.com/Houssemamor/ARTIFICIAL-LIFE-Simulation-Using-Neuroevolution-and-Genetic-Algorithms/wiki"
Repository = "https://github.com/Houssemamor/ARTIFICIAL-LIFE-Simulation-Using-Neuroevolution-and-Genetic-Algorithms"

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "flake8==7.3.0",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "mypy-extensions==1.0.0",
    "types-setuptools==69.5.1",
]
# Note: the design doc's optional Dear ImGui debug overlay (imgui[pygame])
# is deliberately NOT declared: imgui fails to build on Python 3.13+ (Cython
# incompatibility). Revisit when an compatible imgui release exists.

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "agents*", "analytics*", "evolution*", "experiments*", "neural*", "simulation*", "visualization*", "webdash*"]

[tool.setuptools.package-data]
# The dashboard's index.html must ship inside the wheel: StaticFiles
# mounts it from the package directory, not from the source checkout.
webdash = ["frontend/*.html"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = false